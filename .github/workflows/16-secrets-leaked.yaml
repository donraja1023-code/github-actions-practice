name: Secrets Leaked

on:
  workflow_dispatch:

jobs:
  masking-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Demonstrate masking behavior
        env:
          SECRET: ${{ secrets.MY_SECRET }}
        run: |
          echo "1. Exact value:"
          echo "$SECRET"

          echo "2. Base64 encoded:"
          printf '%s' "$SECRET" | base64

          echo "3. URL encoded:"
          python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SECRET"]))'

          echo "4. Split across two output operations:"
          printf '%s' "${SECRET:0:5}"
          printf '%s\n' "${SECRET:5}"

          echo "5. Different capitalization:"
          echo "$SECRET" | tr '[:lower:]' '[:upper:]'
